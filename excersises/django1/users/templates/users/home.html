{% extends "users/base.html" %}

{% block content %}

<h3>Add Profile</h3>

<form method="POST" class="card p-4 shadow">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Add</button>
</form>

<hr>

<h3>My Profiles</h3>

<ul>
    {% for profile in profiles %}
        <li>{{ profile.name }} - {{ profile.email }}</li>
    {% empty %}
        <li>No profiles yet</li>
    {% endfor %}
</ul>

{% endblock %}
