{% extends "users/base.html" %}

{% block content %}
<h1>Register</h1>

<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    {% if form.errors %}
    <div class="alert alert-danger">
        {{ form.errors }}
    </div>
{% endif %}
    <button type="submit">Register</button>
</form>
{% endblock %}
